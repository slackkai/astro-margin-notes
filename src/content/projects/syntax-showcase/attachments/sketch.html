<style>
  .sketch-wave { display: block; width: min(100%, 36rem); margin: 0 auto; }
  .sketch-wave .wave { stroke: var(--pen, #3b4f9e); stroke-dasharray: 900; stroke-dashoffset: 900; animation: sketch-draw 4s ease-in-out infinite alternate; }
  .sketch-wave .axis { stroke: var(--pencil-45, rgba(31, 36, 51, 0.45)); }
  .sketch-wave .dot { fill: var(--marker, #c4562f); animation: sketch-dot 4s ease-in-out infinite alternate; }
  @keyframes sketch-draw { to { stroke-dashoffset: 0; } }
  @keyframes sketch-dot { from { transform: translateX(0); } to { transform: translateX(640px); } }
  @media (prefers-reduced-motion: reduce) { .sketch-wave .wave, .sketch-wave .dot { animation: none; stroke-dashoffset: 0; } }
</style>
